<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動 | nadaclub</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-header"><h1>📋 活動</h1></header>

<div class="tab-bar" id="tab-bar">
  <button class="tab-item active" onclick="switchTab('all')">📅 イベント一覧</button>
  <button class="tab-item" onclick="switchTab('mine')">📝 自分の活動</button>
</div>

<div id="alert-area"></div>
<div id="app"><div class="loading">読み込み中…</div></div>

<nav class="bottom-nav">
  <a href="/home.html"     class="nav-item"><span class="nav-icon">🏠</span>ホーム</a>
  <a href="/activity.html" class="nav-item active"><span class="nav-icon">📋</span>活動</a>
  <a href="/profile.html"  class="nav-item"><span class="nav-icon">👤</span>マイページ</a>
</nav>

<script>
const API = (path, opt={}) => fetch(path, { headers: { Authorization: 'Bearer ' + localStorage.getItem('nc_token'), 'Content-Type':'application/json' }, ...opt });
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const DAYS = ['日','月','火','水','木','金','土'];
const CATS = {
  env:   { label:'環境・自然', icon:'🌿', cls:'cat-env' },
  food:  { label:'食・農業',   icon:'🌾', cls:'cat-food' },
  child: { label:'子ども・教育',icon:'🧒', cls:'cat-child' },
  elder: { label:'高齢者支援', icon:'🤝', cls:'cat-elder' },
  art:   { label:'文化・芸術', icon:'🎨', cls:'cat-art' },
  local: { label:'地域活性',   icon:'🏘️', cls:'cat-local' },
  other: { label:'その他',     icon:'💬', cls:'cat-other' },
};

let activeTab = 'all';
let myUserId = null;
let showForm = false;

function showAlert(msg, type='success') {
  document.getElementById('alert-area').innerHTML = `<div class="alert alert-${type}">${esc(msg)}</div>`;
  setTimeout(() => document.getElementById('alert-area').innerHTML = '', 3000);
}

function diffDays(dateStr) {
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

function switchTab(tab) {
  activeTab = tab;
  showForm = false;
  document.querySelectorAll('.tab-item').forEach((el,i) => el.classList.toggle('active', (i===0&&tab==='all')||(i===1&&tab==='mine')));
  render();
}

function formHtml() {
  return `
  <div class="form-card">
    <div class="form-title">📝 新しく作る</div>
    <div class="form-group"><label>タイトル <span class="required">*</span></label>
      <input id="ev-title" type="text" placeholder="例：六甲川の清掃をします！"></div>
    <div class="form-group"><label>内容・呼びかけ <span class="required">*</span></label>
      <textarea id="ev-desc" placeholder="何をするか、どんな人に来てほしいか"></textarea></div>
    <div class="form-group"><label>カテゴリ</label>
      <select id="ev-cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('')}</select></div>

    <div style="display:flex;align-items:center;gap:8px;margin:14px 0 10px">
      <input type="checkbox" id="ev-has-date" onchange="toggleDateFields()" style="width:18px;height:18px">
      <label style="margin:0;font-size:13px;font-weight:600;color:var(--text2)">日時・場所を決めて開催する（イベント）</label>
    </div>

    <div id="date-fields" style="display:none">
      <div class="form-row">
        <div class="form-group"><label>開催日</label>
          <input id="ev-date" type="date"></div>
        <div class="form-group"><label>時間（任意）</label>
          <input id="ev-time" type="time"></div>
      </div>
      <div class="form-group"><label>募集締切（任意）</label>
        <input id="ev-deadline" type="date"></div>
      <div class="form-group"><label>場所</label>
        <input id="ev-loc" type="text" placeholder="例：六甲川 王子橋付近"></div>
      <div class="form-row">
        <div class="form-group"><label>定員（任意）</label>
          <input id="ev-cap" type="number" min="0" placeholder="例：20"></div>
        <div class="form-group"><label>持ち物（任意）</label>
          <input id="ev-items" type="text" placeholder="例：飲み物、帽子"></div>
      </div>
    </div>

    <button class="btn btn-primary btn-full" onclick="postEvent()">投稿する</button>
    <button class="btn btn-outline btn-full" style="margin-top:8px" onclick="toggleForm()">キャンセル</button>
  </div>`;
}

function toggleDateFields() {
  const has = document.getElementById('ev-has-date').checked;
  document.getElementById('date-fields').style.display = has ? 'block' : 'none';
}

function toggleForm() {
  showForm = !showForm;
  render();
}

function renderEventDetailCard(ev, mode) {
  const cat = CATS[ev.category] || CATS.other;
  const isMe = ev.user_id === myUserId;
  const hasDate = !!ev.event_date;
  let dateInfo = '';
  let badge = '';

  if (hasDate) {
    const d = new Date(ev.event_date);
    const diff = diffDays(ev.event_date);
    const time = ev.event_time ? ev.event_time.slice(0,5) : '';
    dateInfo = `
      <div class="ev-meta">
        <span class="meta-item">📅 ${d.getMonth()+1}月${d.getDate()}日（${DAYS[d.getDay()]}）${time ? ' '+time : ''}</span>
        ${ev.location ? `<span class="meta-item">📍 ${esc(ev.location)}</span>` : ''}
        ${ev.capacity ? `<span class="meta-item">👥 定員${ev.capacity}名（${ev.join_count||0}名参加）</span>` : ''}
      </div>`;
    if (diff < 0) badge = '<span class="ev-badge badge-done">終了</span>';
    else if (ev.joined) badge = '<span class="ev-badge badge-joined">参加表明済み</span>';
    else badge = `<span class="ev-badge badge-soon">あと${diff}日</span>`;
  } else {
    badge = '<span class="ev-badge" style="background:#FFF3E0;color:#C07000">相談・募集</span>';
  }

  const canJoin = hasDate && diffDays(ev.event_date) >= 0 && !isMe;

  return `<div class="event-card">
    <div class="ev-head">
      <div class="ev-title-wrap">
        <span class="cat-badge ${cat.cls}" style="font-size:11px;margin-bottom:6px;display:inline-block">${cat.icon} ${cat.label}</span>
        <div class="ev-title">${esc(ev.title)}</div>
      </div>
      ${badge}
    </div>
    ${dateInfo}
    ${ev.description ? `<div class="ev-body">${esc(ev.description)}</div>` : ''}
    ${ev.items ? `<div class="ev-body">🎒 持ち物：${esc(ev.items)}</div>` : ''}
    <div class="ev-footer">
      <div class="host-avatar">${esc(ev.users?.avatar||'😊')}</div>
      <span class="host-name">${esc(ev.users?.name||'')}</span>
      ${isMe
        ? `<button class="btn btn-sm btn-danger" onclick="deleteEvent(${ev.id})">削除</button>`
        : canJoin
          ? (ev.joined
              ? `<button class="btn btn-sm btn-joined" onclick="cancelJoin(${ev.id})">参加取消</button>`
              : `<button class="btn btn-sm btn-primary" onclick="joinEvent(${ev.id})">参加を表明する</button>`)
          : ''
      }
    </div>
  </div>`;
}

async function renderAll() {
  const res = await API('/api/events?filter=upcoming');
  if (res.status === 401) { localStorage.removeItem('nc_token'); return location.href='/index.html'; }
  const data = await res.json();

  let html = `<div style="padding:12px 14px 4px">
    <button class="btn btn-primary btn-full" onclick="toggleForm()">${showForm ? '× 閉じる' : '＋ 新しくつくる'}</button>
  </div>`;
  if (showForm) html += formHtml();

  if (!data.length) {
    html += '<div class="empty-state"><div class="empty-icon">📋</div><p>まだ何もありません。<br>最初のイベント・相談を投稿してみましょう！</p></div>';
  } else {
    data.forEach(ev => { html += renderEventDetailCard(ev, 'all'); });
  }
  document.getElementById('app').innerHTML = html;
  if (document.getElementById('ev-has-date')) toggleDateFields();
}

async function renderMine() {
  const [hostedRes, joinedRes] = await Promise.all([
    API('/api/events?filter=mine'),
    API('/api/events?filter=joined'),
  ]);
  const hosted = hostedRes.ok ? await hostedRes.json() : [];
  const joined = joinedRes.ok ? await joinedRes.json() : [];

  let html = `<div class="section-title">📝 自分が主催したもの</div>`;
  if (hosted.length) {
    hosted.forEach(ev => { html += renderEventDetailCard(ev, 'hosted'); });
  } else {
    html += '<div class="empty-state"><div class="empty-icon">📝</div><p>まだ主催したものがありません</p></div>';
  }

  html += `<div class="section-title">✋ 自分が参加を申し込んだもの</div>`;
  if (joined.length) {
    joined.forEach(ev => { html += renderEventDetailCard(ev, 'joined'); });
  } else {
    html += '<div class="empty-state"><div class="empty-icon">✋</div><p>まだ参加したものがありません</p></div>';
  }

  document.getElementById('app').innerHTML = html;
}

async function render() {
  document.getElementById('app').innerHTML = '<div class="loading">読み込み中…</div>';
  if (activeTab === 'all') await renderAll();
  else await renderMine();
}

async function postEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const desc = document.getElementById('ev-desc').value.trim();
  if (!title || !desc) return showAlert('タイトルと内容は必須です', 'error');

  const hasDate = document.getElementById('ev-has-date').checked;
  const body = {
    title, description: desc,
    category: document.getElementById('ev-cat').value,
  };
  if (hasDate) {
    const eventDate = document.getElementById('ev-date').value;
    if (!eventDate) return showAlert('開催日を入力してください', 'error');
    body.event_date = eventDate;
    body.event_time = document.getElementById('ev-time').value || null;
    body.deadline = document.getElementById('ev-deadline').value || null;
    body.location = document.getElementById('ev-loc').value.trim();
    body.capacity = document.getElementById('ev-cap').value || 0;
    body.items = document.getElementById('ev-items').value.trim();
  }

  const res = await API('/api/events', { method:'POST', body: JSON.stringify(body) });
  if (res.ok) { showAlert('投稿しました！'); showForm = false; render(); }
  else showAlert('エラーが発生しました', 'error');
}

async function deleteEvent(id) {
  if (!confirm('削除しますか？')) return;
  await API('/api/events', { method:'POST', body: JSON.stringify({ delete_id: id }) });
  render();
}

async function joinEvent(id) {
  await API('/api/events', { method:'POST', body: JSON.stringify({ action: 'join', event_id: id }) });
  showAlert('参加を表明しました！'); render();
}

async function cancelJoin(id) {
  await API('/api/events', { method:'POST', body: JSON.stringify({ action: 'cancel_join', event_id: id }) });
  render();
}

async function init() {
  const t = localStorage.getItem('nc_token');
  if (!t) return location.href = '/index.html';
  const profRes = await API('/api/profile');
  if (profRes.status === 401) { localStorage.removeItem('nc_token'); return location.href='/index.html'; }
  const prof = await profRes.json();
  myUserId = prof.user?.id;
  render();
}
init();
</script>
</body>
</html>
