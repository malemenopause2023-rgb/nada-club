<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホーム | nadaclub</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-header">
  <h1>🌿 nadaclub</h1>
  <span id="member-count-tag" class="header-user-tag" style="display:none"></span>
</header>

<div id="app"><div class="loading">読み込み中…</div></div>

<nav class="bottom-nav">
  <a href="/home.html"      class="nav-item active"><span class="nav-icon">🏠</span>ホーム</a>
  <a href="/activity.html"  class="nav-item"><span class="nav-icon">📋</span>活動</a>
  <a href="/profile.html"   class="nav-item"><span class="nav-icon">👤</span>マイページ</a>
</nav>

<script>
const _p = new URLSearchParams(location.search);
const _t = _p.get('token');
if (_t) { localStorage.setItem('nc_token', _t); history.replaceState({}, '', '/home.html'); }

const API = (path, opt = {}) => {
  const t = localStorage.getItem('nc_token');
  return fetch(path, { headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, ...opt });
};

const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const DAYS = ['日','月','火','水','木','金','土'];
const CATS = {
  env:{label:'環境・自然',icon:'🌿',cls:'cat-env'}, food:{label:'食・農業',icon:'🌾',cls:'cat-food'},
  child:{label:'子ども・教育',icon:'🧒',cls:'cat-child'}, elder:{label:'高齢者支援',icon:'🤝',cls:'cat-elder'},
  art:{label:'文化・芸術',icon:'🎨',cls:'cat-art'}, local:{label:'地域活性',icon:'🏘️',cls:'cat-local'}, other:{label:'その他',icon:'💬',cls:'cat-other'},
};

function diffDays(dateStr) {
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

function renderEventCard(ev) {
  const cat = CATS[ev.category] || CATS.other;
  const hasDate = !!ev.event_date;
  let badge = '', metaLine = '';

  if (hasDate) {
    const d = new Date(ev.event_date);
    const diff = diffDays(ev.event_date);
    const time = ev.event_time ? ev.event_time.slice(0,5) : '';
    metaLine = `<span class="meta-item">📅 ${d.getMonth()+1}月${d.getDate()}日（${DAYS[d.getDay()]}）${time?' '+time:''}</span>
      ${ev.location ? `<span class="meta-item">📍 ${esc(ev.location)}</span>` : ''}`;
    badge = diff <= 3 ? `<span class="ev-badge badge-soon">あと${diff}日</span>` : '<span class="ev-badge badge-new">新着</span>';
  } else {
    badge = '<span class="ev-badge" style="background:#FFF3E0;color:#C07000">相談・募集</span>';
  }

  return `
  <div class="event-card">
    <div class="ev-head">
      <div class="ev-title-wrap">
        <span class="cat-badge ${cat.cls}" style="font-size:11px;margin-bottom:6px;display:inline-block">${cat.icon} ${cat.label}</span>
        <div class="ev-title">${esc(ev.title)}</div>
      </div>
      ${badge}
    </div>
    <div class="ev-meta">${metaLine}</div>
    ${ev.description ? `<div class="ev-body">${esc(ev.description.slice(0,60))}${ev.description.length>60?'…':''}</div>` : ''}
    <div class="ev-footer">
      <div class="host-avatar">${esc(ev.users?.avatar || '😊')}</div>
      <span class="host-name">${esc(ev.users?.name || '')}</span>
      <a href="/activity.html" class="btn btn-sm btn-outline">詳細を見る</a>
    </div>
  </div>`;
}

const DUMMY_COUPONS = [
  { title: '近日、地元店舗のクーポンが届く予定です', org_name: 'nadaclub運営', description: '企業連携機能を準備中です。お楽しみに！' },
];

async function init() {
  const t = localStorage.getItem('nc_token');
  if (!t) return location.href = '/index.html';

  const [evRes, profRes, statsRes] = await Promise.all([
    API('/api/events?filter=upcoming'),
    API('/api/profile'),
    API('/api/stats'),
  ]);

  if (evRes.status === 401) { localStorage.removeItem('nc_token'); return location.href = '/index.html'; }

  const events = await evRes.json();
  const prof   = await profRes.json();
  const stats  = statsRes.ok ? await statsRes.json() : { user_count: 0 };

  const countTag = document.getElementById('member-count-tag');
  countTag.textContent = `👥 ${stats.user_count}人`;
  countTag.style.display = '';

  let html = '';

  const dated = (events || []).filter(e => e.event_date).slice(0, 3);
  html += `<div class="section-head-row">
    <span class="section-title" style="padding:0">📅 近日のイベント</span>
    <a href="/activity.html" class="section-more">もっと見る →</a>
  </div>`;
  if (dated.length) {
    dated.forEach(ev => { html += renderEventCard(ev); });
  } else {
    html += `<div class="empty-small">まだイベントがありません</div>`;
  }

  html += `<div class="section-head-row"><span class="section-title" style="padding:0">🎁 クーポン・お得情報</span></div>`;
  DUMMY_COUPONS.forEach(c => {
    html += `<div class="coupon-card">
      <div class="coupon-head"><span class="coupon-title">${esc(c.title)}</span></div>
      <div class="coupon-org">🏪 ${esc(c.org_name)}</div>
      <div class="coupon-desc">${esc(c.description)}</div>
    </div>`;
  });

  html += `<div class="section-head-row">
    <span class="section-title" style="padding:0">📢 最新情報</span>
    <a href="/activity.html" class="section-more">もっと見る →</a>
  </div>`;
  const recent = (events || []).slice(0, 5);
  if (recent.length) {
    recent.forEach(ev => { html += renderEventCard(ev); });
  } else {
    html += `<div class="empty-small">まだ最新情報がありません</div>`;
  }

  document.getElementById('app').innerHTML = html;
}

init();
</script>
</body>
</html>
